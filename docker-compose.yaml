version: "3.9"

services:
  nexlayer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexlayer
      POSTGRES_PASSWORD: nexlayer_secret
      POSTGRES_DB: nexlayer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexlayer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
